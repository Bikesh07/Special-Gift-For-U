<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise💗</title>

    <link rel="stylesheet" href="style.css">

    <link
            href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
            rel="stylesheet"
    >
</head>

<body class="locked">

<!-- LOGIN SCREEN -->
<section id="loginScreen" class="login-screen">

    <div class="login-particles"></div>

    <div class="login-card">

        <div class="login-heart">♡</div>

        <p class="login-small">
            A little surprise awaits
        </p>

        <h1>
            For U Menka Ji
        </h1>

        <p class="login-text">
            Enter the secret password to open your birthday surprise ✨
        </p>

        <form id="loginForm">

            <div class="password-box">

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="off"
                        required
                >

                <button
                        type="button"
                        id="togglePassword"
                        class="eye-btn"
                        aria-label="Show password"
                >
                    👁
                </button>

            </div>

            <button
                    type="submit"
                    class="login-btn"
            >
                Unlock My Surprise 💗
            </button>

            <p id="loginError" class="login-error">
                Incorrect password. Try again ❤️
            </p>

        </form>

        <div class="login-decoration">
            ✦ &nbsp; ♡ &nbsp; ✦
        </div>

    </div>

</section>

<!-- PERSISTENT MUSIC: this audio belongs to the login page, so the login button
     itself is the browser user gesture that starts playback. -->
<audio id="siteMusic" preload="auto" loop>
    <source src="birthday_audio.mp3" type="audio/mpeg">
</audio>

<!-- MAIN WEBSITE -->
<main id="mainContent"></main>

<!-- PRELOADED MAIN SITE -->
<iframe id="siteFrame" class="site-frame" src="index01.html" title="Birthday surprise" allow="autoplay" loading="eager"></iframe>

<!-- JAVASCRIPT -->
<script>
    const PASSWORD = "menka143";

    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const loginError = document.getElementById("loginError");
    const togglePassword = document.getElementById("togglePassword");

    /* Show / hide password */
    togglePassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            togglePassword.textContent = "🙈";
        } else {
            passwordInput.type = "password";
            togglePassword.textContent = "👁";
        }
    });

    /* Login */
    loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const enteredPassword = passwordInput.value;

        if (enteredPassword === PASSWORD) {

            loginError.style.display = "none";

            // IMPORTANT: play the persistent audio in THIS document.
            // A normal navigation/iframe autoplay can be blocked by browser policy,
            // but a play() call made directly from the successful button click
            // uses the click as the user gesture.
            const siteMusic = document.getElementById("siteMusic");
            if (siteMusic) {
                siteMusic.muted = false;
                siteMusic.volume = 0.65;
                siteMusic.play().catch(() => {});
            }

            const siteFrame = document.getElementById("siteFrame");

            document.body.classList.add("site-open");
            document.getElementById("loginScreen").classList.add("hidden");
            siteFrame.classList.add("visible");

            // The main page can control this parent audio through postMessage.
            // This keeps one audio element only and avoids competing players.
            if (!siteFrame.dataset.audioBridgeBound) {
                siteFrame.dataset.audioBridgeBound = "1";
                window.addEventListener("message", function (event) {
                    if (event.source !== siteFrame.contentWindow) return;
                    if (!event.data || event.data.type !== "birthday-audio") return;
                    if (!siteMusic) return;
                    if (event.data.action === "play") {
                        siteMusic.play().then(() => {
                            siteFrame.contentWindow.postMessage(
                                { type: "birthday-audio-state", playing: true }, "*"
                            );
                        }).catch(() => {});
                    }
                    if (event.data.action === "pause") {
                        siteMusic.pause();
                        siteFrame.contentWindow.postMessage(
                            { type: "birthday-audio-state", playing: false }, "*"
                        );
                    }
                    if (event.data.action === "setVolume") {
                        siteMusic.volume = Math.max(0, Math.min(1, Number(event.data.value) || 0.65));
                    }
                });
            }


        } else {

            loginError.style.display = "block";

            passwordInput.value = "";
            passwordInput.focus();
        }
    });
</script>

</body>
</html>
